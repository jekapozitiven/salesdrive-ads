name: Ads collector (SalesDrive)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Разведка полей (оставь 1 для первого запуска)"
        required: false
        default: "1"
      days:
        description: "За сколько последних дней тянуть"
        required: false
        default: "14"
  schedule:
    - cron: "15 * * * *"   # каждый час в :15 — боевой прогон (probe=0), пишет в Firebase   # каждый час в :05

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run collector
        env:
          SALESDRIVE_URL: ${{ secrets.SALESDRIVE_URL }}
          SALESDRIVE_API_KEY: ${{ secrets.SALESDRIVE_API_KEY }}
          SD_DAYS: ${{ github.event.inputs.days || '14' }}
          # по расписанию inputs пусты -> '0' (боевой). При ручном запуске берётся поле формы.
          SD_PROBE: ${{ github.event.inputs.probe || '0' }}
          # категорию берём из воркера «Товары» (публичный /lookup) — токены не нужны.
          # id статусов SalesDrive, которые = апрув (через запятую), напр. "6,9,11":
          APRUV_STATUS: ${{ secrets.APRUV_STATUS }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          # понадобится дальше (маржа/дроп):
          MYDROP_API_KEY: ${{ secrets.MYDROP_API_KEY }}
        run: python collector.py

      - name: Upload sample (если был обычный прогон)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders_sample
          path: orders_sample.json
          if-no-files-found: ignore
